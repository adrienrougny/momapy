name: Tests

on:
  workflow_call:
  push:
    branches:
      - testing
      - main

jobs:
  lint:
    name: Lint (ruff D + ANN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run ruff lint and format checks
        run: uvx --with tox-uv tox -e lint
        shell: bash

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache tox environments
        uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
      - name: Run tests with tox (min scenario)
        run: |
          PYTHON_VERSION="${{ matrix.python-version }}"
          uvx --with tox-uv tox -e "py${PYTHON_VERSION//./}-min"
        shell: bash
